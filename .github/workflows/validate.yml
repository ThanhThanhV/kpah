              ProtocolWorldStateCodec.Opcode39 sms39=ProtocolWorldStateCodec.decodeS2COpcode39(
                new PacketWriter().writeUTF("123").writeBool(true).writeUTF("Register").writeUTF("sms://1234").toByteArray());
