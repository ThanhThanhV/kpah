                  .writeI16(1).writeU8(3).writeU8(1).writeI16(2).writeU8(4).writeU8(5)
                  .writeI8(1).writeI16(1).writeU8(7).toByteArray());
              ProtocolWorldStateCodec.OpcodeMinus9 list9=ProtocolWorldStateCodec.decodeS2COpcodeMinus9(
                new PacketWriter().writeI16(2).writeI16(10).writeI16(-20).writeUTF("done").toByteArray());
