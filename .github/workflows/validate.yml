                .writeI8(9).writeI16(1001).writeI16(22).writeI8(3).writeI8(4).writeI16(55).writeI16(66)
                .writeI8(7).writeI8(8).writeI8(9).writeI8(10).writeI8(11).writeI8(12).writeI8(13).writeI8(14).writeI8(15)
                .writeUTF("Sword").writeU16(65500).writeI8(2).writeU8(4).writeI16(-50).writeU8(8).writeI16(75).writeI8(16)
                .writeI32(333).writeI32(444).writeU8(0xfa);
              PacketWriter mode2Packet = new PacketWriter().writeU8(2).writeI32(123).writeI8(1)
                .writeI16(101).writeI8(2).writeI8(3).writeI8(4).writeUTF("first-b").writeUTF("first-a").writeI8(5)
                .writeI8(1).writeI16(201).writeI8(6).writeI8(7).writeUTF("second-b").writeI8(8)
                .writeUTF("second-a").writeI32(-987).writeI8(9).writeI32(456).writeU8(0xca);
              ProtocolInitializationCodec.Decoded mode2 = ProtocolInitializationCodec.decodeS2COpcode16(mode2Packet.toByteArray());
              if (!mode2.decoded() || mode2.mode() != 2 || mode2.aY() != 123 || mode2.aZ() != 456
                  || mode2.firstCollection().size() != 1 || !mode2.firstCollection().get(0).b().equals("first-b")
                  || !mode2.firstCollection().get(0).a().equals("first-a")
                  || mode2.secondCollection().size() != 1 || !mode2.secondCollection().get(0).b().equals("second-b")
                  || !mode2.secondCollection().get(0).a().equals("second-a")
                  || mode2.secondCollection().get(0).g() != -987
                  || !Arrays.equals(mode2.trailingBytes(), new byte[]{(byte)0xca}))
                throw new AssertionError("opcode 16 mode 2 decode: " + mode2);
              ProtocolInitializationCodec.Decoded mode1 = ProtocolInitializationCodec.decodeS2COpcode16(mode1Packet.toByteArray());
              ProtocolInitializationCodec.InventoryItem mode1Item = mode1.items().get(0);
              if (!mode1.decoded() || mode1.mode() != 1 || mode1.items().size() != 1
                  || mode1Item.i() != 1001 || !mode1Item.d().equals("Sword") || mode1Item.w() != 65500
                  || !mode1Item.stats().equals(List.of(new ProtocolInitializationCodec.InventoryStat(4, (short)-50),
                                                       new ProtocolInitializationCodec.InventoryStat(8, (short)75)))
                  || mode1.aY() != 333 || mode1.aZ() != 444
                  || !Arrays.equals(mode1.trailingBytes(), new byte[]{(byte)0xfa}))
                throw new AssertionError("opcode 16 mode 1 decode: " + mode1);
              ProtocolInitializationCodec.Decoded mode3 = ProtocolInitializationCodec.decodeS2COpcode16(
                new PacketWriter().writeU8(3).writeI32(111).writeI8(3).writeI16(101).writeI16(202).writeI16(-303)
                  .writeI32(222).writeU8(0xbe).toByteArray());
              if (!mode3.decoded() || mode3.aY() != 111 || mode3.aZ() != 222
                  || !Arrays.equals(mode3.values(), new short[]{101,202,-303})
                  || !Arrays.equals(mode3.trailingBytes(), new byte[]{(byte)0xbe}))
                throw new AssertionError("opcode 16 mode 3 decode: " + mode3);
              ProtocolInitializationCodec.Decoded opaqueInit = ProtocolInitializationCodec.decodeS2COpcode16(new byte[]{4, 0x10, 0x20});
              if (opaqueInit.decoded() || opaqueInit.mode() != 4
                  || !Arrays.equals(opaqueInit.opaquePayload(), new byte[]{0x10, 0x20}))
                throw new AssertionError("opcode 16 opaque mode preservation");
              System.out.println("Generated Java protocol, transport, opcode 3 prefix and opcode 16 modes 0/1/2/3 codecs: PASS");
            }
          }
          JAVA
          javac --release 21 -cp "$RUNNER_TEMP/kpah-protocol-classes" -d "$RUNNER_TEMP/kpah-protocol-classes" "$RUNNER_TEMP/ProtocolCodegenSmoke.java"
          java -cp "$RUNNER_TEMP/kpah-protocol-classes" ProtocolCodegenSmoke
      - name: Smoke-test bytecode analyzer and class-role report
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/kpah-classes"
          cat > "$RUNNER_TEMP/Smoke.java" <<'JAVA'
          public class Smoke {
            private static int count = 2;
            public static String run(int mode) {
              switch (mode) {
                case 1: return "KPAH smoke" + helper();
                case 2: return new StringBuilder().append(count).toString();
                default: return "idle";
              }
            }
            private static int helper() { return count + 1; }
          }
          JAVA
          javac --release 8 -g -d "$RUNNER_TEMP/kpah-classes" "$RUNNER_TEMP/Smoke.java"
          python tools/analyze_class_files.py "$RUNNER_TEMP/kpah-classes" --output "$RUNNER_TEMP/kpah-class-analysis.json" --contains KPAH
          python tools/suggest_class_roles.py "$RUNNER_TEMP/kpah-class-analysis.json" --json "$RUNNER_TEMP/class-roles.json" --markdown "$RUNNER_TEMP/class-roles.md"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'kpah-class-analysis.json').read_text())
          roles = json.loads((Path(os.environ['RUNNER_TEMP']) / 'class-roles.json').read_text())
          assert report['parsedClassCount'] == 1, report
          assert report['callEdgeCount'] > 0, report
          assert report['fieldReferenceCount'] > 0, report
          assert report['typeReferenceCount'] > 0, report
          assert roles['classCount'] == 1, roles
          assert roles['hypothesisCount'] + roles['unclassifiedCount'] + roles['verifiedAnchorCount'] == 1, roles
          print('Bytecode analyzer and role report smoke tests passed')
          PY
      - name: Smoke-test asset manifest integrity verifier
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/kpah-assets/decoded"
          printf 'synthetic asset' > "$RUNNER_TEMP/kpah-assets/decoded/demo.bin"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'kpah-assets'
          source_hash = hashlib.sha256(b'synthetic jar').hexdigest()
          entry_hash = hashlib.sha256(b'synthetic archive entry').hexdigest()
          decoded_hash = hashlib.sha256((root / 'decoded/demo.bin').read_bytes()).hexdigest()
          files = [('archive/entry.bin', entry_hash), ('decoded/demo.bin', decoded_hash)]
          material = json.dumps({'sourceSha256': source_hash, 'files': files}, ensure_ascii=False, separators=(',', ':'), sort_keys=True).encode('utf-8')
          version = hashlib.sha256(material).hexdigest()[:16]
          manifest = {'hashAlgorithm': 'SHA-256', 'sourceSha256': source_hash, 'assetVersion': version,
                      'entries': [{'path': files[0][0], 'sha256': entry_hash}],
                      'decodedPackedEntries': [{'output': files[1][0], 'sha256': decoded_hash}]}
          (root / 'archive-manifest.json').write_text(json.dumps(manifest), encoding='utf-8')
          PY
          python tools/verify_asset_manifest.py "$RUNNER_TEMP/kpah-assets"
          printf 'tampered' > "$RUNNER_TEMP/kpah-assets/decoded/demo.bin"
          if python tools/verify_asset_manifest.py "$RUNNER_TEMP/kpah-assets"; then
            echo 'Verifier did not detect tampered asset' >&2
            exit 1
          fi
          echo 'Asset manifest verifier correctly rejected a modified file'

  analyze-original-jar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract original JAR and class files
        run: python tools/extract_kpah_jar.py KPAH_278.jar --include-classes --class-output tools/reports/class-files
      - name: Verify extracted asset hashes
        run: python tools/verify_asset_manifest.py public/assets/kpah-original --jar KPAH_278.jar
      - name: Analyze original Java classes
        run: python tools/analyze_class_files.py tools/reports/class-files --output tools/reports/kpah-class-analysis.json
      - name: Download CFR decompiler
        run: curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar --output "$RUNNER_TEMP/cfr.jar"
      - name: Decompile original JAR with CFR
        run: java -jar "$RUNNER_TEMP/cfr.jar" KPAH_278.jar --outputdir tools/reports/cfr-source --silent true
      - name: Extract C2S and S2C opcode catalog
        run: python tools/extract_protocol_catalog.py tools/reports/cfr-source --json tools/reports/protocol-opcode-catalog.json --markdown tools/reports/protocol-opcode-catalog.md
      - name: Build evidence-ranked class role map
        run: python tools/suggest_class_roles.py tools/reports/kpah-class-analysis.json --json tools/reports/class-role-candidates.json --markdown tools/reports/class-role-candidates.md
      - name: Upload reverse-engineering reports
        uses: actions/upload-artifact@v4
        with:
          name: kpah-original-jar-analysis
          path: |
            tools/reports/kpah-class-analysis.json
            tools/reports/class-role-candidates.json
            tools/reports/class-role-candidates.md
            tools/reports/protocol-opcode-catalog.json
            tools/reports/protocol-opcode-catalog.md
            tools/reports/cfr-source/**/*.java
            public/assets/kpah-original/archive-manifest.json
          if-no-files-found: error
          retention-days: 14
