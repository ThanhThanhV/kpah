name: Validate KPAH web client and reverse-engineering tools

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install client dependencies
        run: npm install --no-audit --no-fund
      - name: Build client
        run: npm run build
      - name: Compile Python tooling
        run: python -m compileall -q tools
      - name: Test protocol reference vectors
        run: python tools/kpah_protocol_reference.py --self-test
      - name: Test local TCP replay harness
        run: npm run test:replay-harness
      - name: Verify generated protocol sources
        run: npm run check:protocol-generated
      - name: Verify generated transport sources
        run: npm run check:transport-generated
      - name: Verify generated S2C prefix sources
        run: npm run check:prefix-protocol
      - name: Test generated S2C prefix codec
        run: npm run test:prefix-protocol
      - name: Verify generated initialization codec
        run: npm run check:initialization-protocol
      - name: Test generated initialization codec
        run: npm run test:initialization-protocol
      - name: Verify generated opcode 15 codec
        run: npm run check:opcode15
      - name: Test generated opcode 15 codec
        run: npm run test:opcode15
      - name: Verify generated opcode 1 codec
        run: npm run check:opcode1
      - name: Test generated opcode 1 codec
        run: npm run test:opcode1
      - name: Verify generated opcode 3 extension codec
        run: npm run check:opcode3-extension
      - name: Test generated opcode 3 extension codec
        run: npm run test:opcode3-extension
      - name: Verify generated opcode 5 codec
        run: npm run check:opcode5
      - name: Test generated opcode 5 codec
        run: npm run test:opcode5
      - name: Verify generated world-state codec
        run: npm run check:world-state
      - name: Test generated world-state codec
        run: npm run test:world-state
      - name: Test generated transport codec
        run: npm run test:transport-codegen
      - name: Test generated JavaScript protocol codec
        run: npm run test:protocol-codegen
      - name: Compile and smoke-test generated Java protocol codec
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/kpah-protocol-classes"
          javac --release 21 -d "$RUNNER_TEMP/kpah-protocol-classes" $(find protocol/generated/java -name '*.java')
          cat > "$RUNNER_TEMP/ProtocolCodegenSmoke.java" <<'JAVA'
          import com.kpah.protocol.generated.*;
          import java.io.IOException;
          import java.util.*;
          public class ProtocolCodegenSmoke {
            public static void main(String[] args) throws Exception {
              byte[] payload = ProtocolPacketCodec.encode("C2S_REFINE_ITEM", Map.of("action", 10, "itemId", 17));
              if (!Arrays.equals(payload, new byte[]{10, 17})) throw new AssertionError(Arrays.toString(payload));
              Map<String,Object> decoded = ProtocolPacketCodec.decode("C2S_REFINE_ITEM", payload);
              if (!decoded.get("action").equals(10) || !decoded.get("itemId").equals(17)) throw new AssertionError(decoded);
              if (ProtocolCommand.find(ProtocolCommand.Direction.C2S, -25).orElseThrow() != ProtocolCommand.C2S_REFINE_ITEM) throw new AssertionError("opcode lookup");
              String text = String.valueOf((char) 0) + "Xin chào 😀";
              PacketReader reader = new PacketReader(new PacketWriter().writeUTF(text).toByteArray());
              if (!reader.readUTF().equals(text) || reader.remaining() != 0) throw new AssertionError("modified UTF-8");
              byte[] key = TransportCodec.decodeHandshakeKey(new byte[]{3, 0x10, 0x20, 0x30});
              if (!Arrays.equals(key, new byte[]{0x10, 0x30, 0x00})) throw new AssertionError("key derivation");
              TransportCodec.EncodedFrame frame = TransportCodec.encodeClientFrame(1, new byte[]{1,2,3}, key, 0);
              if (!Arrays.equals(frame.bytes(), new byte[]{0x11,0x30,0x03,0x11,0x32,0x03})) throw new AssertionError("C2S frame");
              TransportCodec.DecodedFrame decodedFrame = TransportCodec.decodeClientFrame(frame.bytes(), key, 0);
              if (decodedFrame.opcode() != 1 || !Arrays.equals(decodedFrame.payload(), new byte[]{1,2,3})) throw new AssertionError("C2S decode");
              TransportCodec.EncodedFrame longFrame = TransportCodec.encodeServerFrame(0x35, new byte[]{1,2,3}, key, 2, true);
              if (!Arrays.equals(longFrame.bytes(), new byte[]{(byte)0x80,0x25,0x30,0x00,0x10,0x33,0x01,0x12,0x33})) throw new AssertionError("S2C long frame");
              TransportCodec.DecodedFrame longDecoded = TransportCodec.decodeServerFrame(longFrame.bytes(), key, 2);
              if (longDecoded.opcode() != 0x35 || !longDecoded.longLength() || !Arrays.equals(longDecoded.payload(), new byte[]{1,2,3})) throw new AssertionError("S2C long decode");
              PacketWriter snapshot = new PacketWriter().writeI16(321).writeUTF("Hero")
                .writeI32(100).writeI32(120).writeI32(40).writeI32(60)
                .writeI8(2).writeI8(4).writeI32(11).writeI32(12).writeI32(13)
                .writeI16(21).writeI16(22).writeI16(23).writeI8(1).writeI8(0);
              for (int i=0;i<8;i++) snapshot.writeI16(30+i);
              snapshot.writeI32(99).writeI16(7).writeU8(3).writeU8(0xaa).writeU8(0xbb).writeU8(0xcc).writeI16(8);
              snapshot.writeI8(9).writeI8(10).writeI8(11).writeI8(12).writeI8(17).writeU8(3).writeU8(0xde).writeU8(0xad);
              ProtocolPrefixCodec.DecodedPrefix prefix = ProtocolPrefixCodec.decodeS2C(3, snapshot.toByteArray());
              if (!prefix.fields().get("characterName").equals("Hero") || !prefix.fields().get("currentHp").equals(100)
                  || !Arrays.equals((byte[])prefix.fields().get("actionMapping"), new byte[]{(byte)0xaa,(byte)0xbb,(byte)0xcc})
                  || !Arrays.equals(prefix.trailingBytes(), new byte[]{3,(byte)0xde,(byte)0xad})
                  || prefix.decodedPrefixBytes() != snapshot.toByteArray().length - 3)
                throw new AssertionError("opcode 3 prefix decode: " + prefix);
              PacketReader partialIntReader = new PacketReader(new byte[]{1,2});
              try { partialIntReader.readI32(); throw new AssertionError("expected partial int EOF"); }
              catch (IOException expected) { }
              if (partialIntReader.remaining() != 0) throw new AssertionError("Java PacketReader must consume partial int bytes");
              PacketReader partialUtfReader = new PacketReader(new byte[]{0,3,65,66});
              try { partialUtfReader.readUTF(); throw new AssertionError("expected partial UTF EOF"); }
              catch (IOException expected) { }
              if (partialUtfReader.remaining() != 0) throw new AssertionError("Java PacketReader must consume partial UTF bytes");
              PacketWriter initPacket = new PacketWriter().writeU8(0).writeI64(9_007_199_254_740_993L)
                .writeU8(2).writeU8(3).writeI32(-1200).writeU8(8).writeI32(250000)
                .writeI32(123456).writeI32(654321).writeU8(0xde);
              PacketWriter shop15 = new PacketWriter().writeI8(0).writeI16(321).writeI8(0)
                .writeI8(2).writeI16(1).writeI16(2).writeI16(3).writeI16(4).writeI16(5)
                .writeI8(-1).writeI8(-1);
              ProtocolOpcode15Codec.Decoded shopDecoded = ProtocolOpcode15Codec.decode(shop15.toByteArray());
              if (!shopDecoded.accepted() || shopDecoded.subtype() != 0 || shopDecoded.targetCharacterId() != 321
                  || shopDecoded.items().size() != 0 || shopDecoded.aS() != 2
                  || !Arrays.equals(shopDecoded.shortValues(), new short[]{1,2,3,4,5})
                  || shopDecoded.optionalText() != null || shopDecoded.optionalContext() != null)
                throw new AssertionError("opcode 15 subtype 0 decode: " + shopDecoded);
              PacketWriter shopItem15 = new PacketWriter().writeI8(0).writeI16(321).writeI8(1)
                .writeI8(7).writeI16(1001).writeI16(22).writeI8(3).writeI8(4).writeI16(55).writeI16(66)
                .writeI8(8).writeI8(9).writeI8(10).writeI8(11).writeI8(12).writeI8(13).writeI8(14)
                .writeUTF("Armor").writeU16(60000).writeI8(1).writeU8(4).writeI16(-50)
                .writeI8(2).writeI16(101).writeI16(102).writeI16(103).writeI16(104).writeI16(105)
                .writeI8(-1).writeI8(2).writeI8(2).writeI16(201).writeI8(3).writeUTF("Expiry").writeI32(1440);
              ProtocolOpcode15Codec.Decoded shopItemDecoded = ProtocolOpcode15Codec.decode(shopItem15.toByteArray());
              if (shopItemDecoded.items().size() != 1 || shopItemDecoded.items().get(0).i() != 1001
                  || !shopItemDecoded.items().get(0).d().equals("Armor") || shopItemDecoded.items().get(0).w() != 60000
                  || shopItemDecoded.items().get(0).stats().get(0).statValue() != -50
                  || shopItemDecoded.optionalContext() == null
                  || !shopItemDecoded.optionalContext().text().equals("Expiry")
                  || shopItemDecoded.optionalContext().discardedTypeByte() != 2)
                throw new AssertionError("opcode 15 subtype 0 item/context decode: " + shopItemDecoded);
              PacketWriter petItem15 = new PacketWriter().writeI8(2).writeI16(654).writeI8(1)
                .writeI8(9).writeI16(2001).writeI16(32).writeI8(5).writeI8(6).writeI16(77).writeI16(88)
                .writeI8(1).writeI8(2).writeI8(3).writeI8(4).writeI8(5).writeI8(6).writeI8(7)
                .writeUTF("Pet").writeI8(1).writeU8(12).writeI16(345).writeI8(3).writeU8(0x89);
              ProtocolOpcode15Codec.Decoded petItemDecoded = ProtocolOpcode15Codec.decode(petItem15.toByteArray());
              if (petItemDecoded.items().size() != 1 || !petItemDecoded.items().get(0).d().equals("Pet")
                  || petItemDecoded.items().get(0).w() != null
                  || petItemDecoded.items().get(0).stats().get(0).statId() != 12
                  || petItemDecoded.frameCount() != 3
                  || !Arrays.equals(petItemDecoded.imageBytes(), new byte[]{(byte)0x89}))
                throw new AssertionError("opcode 15 nonzero subtype item/image decode: " + petItemDecoded);
              PacketWriter pet15 = new PacketWriter().writeI8(1).writeI16(654).writeI8(0).writeI8(3).writeU8(0x89).writeU8(0x50);
              ProtocolOpcode15Codec.Decoded petDecoded = ProtocolOpcode15Codec.decode(pet15.toByteArray());
              if (!petDecoded.accepted() || petDecoded.subtype() != 1 || petDecoded.targetCharacterId() != 654
                  || petDecoded.frameCount() != 3 || petDecoded.atlasLayoutCode() != 3
                  || !Arrays.equals(petDecoded.imageBytes(), new byte[]{(byte)0x89,0x50}))
                throw new AssertionError("opcode 15 pet image decode: " + petDecoded);
              PacketWriter global1 = new PacketWriter().writeI8(2).writeI16(1200).writeU8(1)
                .writeU8(31).writeUTF("Skill A").writeUTF("Desc A").writeI16(900).writeBool(true);
              for (int value : new int[]{2,3,4,5,6}) global1.writeI8(value);
              for (int i=0;i<5;i++) global1.writeI8(0);
              global1.writeI16(77).writeU8(1).writeU8(5);
              for (int i=0;i<100;i++) global1.writeI8((i%9)-4);
              global1.writeI8(11).writeI8(12).writeI8(13).writeI8(14)
                .writeI8(1).writeUTF("Attack").writeI8(6).writeUTF("1800")
                .writeI8(1).writeI8(2).writeI32(300).writeI8(3).writeI32(400)
                .writeI8(1).writeI8(4).writeUTF("Collect").writeUTF("https://example.invalid/help")
                .writeI8(2).writeI16(3).writeU8(1).writeU8(2).writeU8(3)
                .writeI16(2).writeU8(4).writeU8(5).writeI8(7).writeI8(1).writeI16(3).writeU8(8).writeU8(9).writeU8(10);
              ProtocolOpcode1Codec.Decoded globalDecoded = ProtocolOpcode1Codec.decode(global1.toByteArray());
              if (globalDecoded.movementStep() != 3 || globalDecoded.boatTicketPrice() != 1200
                  || globalDecoded.skills().size() != 1 || !globalDecoded.skills().get(0).name().equals("Skill A")
                  || !globalDecoded.professionSkillSlotCounts().equals(List.of((byte)2,(byte)3,(byte)4,(byte)5,(byte)6))
                  || globalDecoded.optionalBlock().auxiliaryShort() != 77
                  || globalDecoded.optionalBlock().matrices()[4][4][3] != ((99%9)-4)
                  || !globalDecoded.statLabels().get(0).name().equals("Attack")
                  || globalDecoded.pairedLookupRows().get(0).rightInt() != 400
                  || !globalDecoded.questObjectives().get(0).name().equals("Collect")
                  || !globalDecoded.tileBlobs().get(1).key().equals("t_thanh")
                  || !Arrays.equals(globalDecoded.partData().get(0).data(), new byte[]{8,9,10})
                  || globalDecoded.partDataError() != null || globalDecoded.trailingBytes().length != 0)
                throw new AssertionError("opcode 1 global configuration decode: " + globalDecoded);
              PacketWriter worldSpawn = new PacketWriter().writeI8(1).writeU8(7).writeI16(123).writeI16(456).writeI16(789).writeI8(2)
                .writeI32(-99).writeI8(4).writeI8(5).writeBool(false);
              ProtocolWorldStateCodec.Opcode4 worldEntities = ProtocolWorldStateCodec.decodeS2COpcode4(worldSpawn.toByteArray());
              if (worldEntities.entities().size() != 1 || worldEntities.entities().get(0).kind() != 1
                  || worldEntities.entities().get(0).entityId() != 123 || worldEntities.entities().get(0).extraInt() != -99
                  || worldEntities.entities().get(0).kind1Subtype() != 4 || worldEntities.entities().get(0).active())
                throw new AssertionError("S2C opcode 4 entity decode: " + worldEntities);
              ProtocolWorldStateCodec.CombatEvent combat6 = ProtocolWorldStateCodec.decodeS2COpcode6(
                new PacketWriter().writeI16(10).writeI16(20).writeI8(3).writeI32(400).writeI32(900)
                  .writeI8(1).writeI8(2).writeI8(3).writeI8(4).toByteArray());
              ProtocolWorldStateCodec.CombatEvent combat9 = ProtocolWorldStateCodec.decodeS2COpcode9(
                new PacketWriter().writeI16(-10).writeI16(20).writeI8(4).writeI32(-400).writeI32(800)
                  .writeI8(5).writeI8(6).writeI8(7).writeI8(8).toByteArray());
              if (combat6.firstEntityId() != 10 || combat6.valueA() != 400 || combat6.flagD() != 4
                  || combat9.firstEntityId() != -10 || combat9.valueA() != -400 || combat9.flagD() != 8)
                throw new AssertionError("S2C combat event opcode 6/9 decode");
              ProtocolWorldStateCodec.Opcode8 removed = ProtocolWorldStateCodec.decodeS2COpcode8(
                new PacketWriter().writeI16(10).writeI16(-20).toByteArray());
              if (!removed.entityIds().equals(List.of((short)10,(short)-20)))
                throw new AssertionError("S2C opcode 8 despawn decode: " + removed);
              ProtocolWorldStateCodec.Opcode12 mapTransition = ProtocolWorldStateCodec.decodeS2COpcode12(
                new PacketWriter().writeI16(1).writeI16(2).writeI16(3).writeI8(4).writeI16(5).writeUTF("Forest")
                  .writeBool(true).writeU8(0xaa).writeU8(0xbb).toByteArray());
              if (mapTransition.hfK() != 4 || !mapTransition.label().equals("Forest")
                  || !Arrays.equals(mapTransition.mapData(), new byte[]{(byte)0xaa,(byte)0xbb}))
                throw new AssertionError("S2C opcode 12 map transition decode: " + mapTransition);
              ProtocolWorldStateCodec.Opcode17 action17 = ProtocolWorldStateCodec.decodeS2COpcode17(
                new PacketWriter().writeI16(101).writeI16(202).writeI8(3).writeI32(450).writeI8(2).writeI8(1)
                  .writeI8(7).writeI16(1).writeI16(2).writeI16(3).writeI16(4).writeI8(3).writeI8(99).writeI8(5).toByteArray());
              if (action17.actorEntityId() != 101 || action17.targetEntityId() != 202
                  || action17.value() != 450 || action17.effects().size() != 1
                  || action17.effects().get(0).valueD() != 4 || action17.repeatCount() != 3
                  || action17.discardedByte() != 99 || action17.modeByte() != 5)
                throw new AssertionError("S2C opcode 17 entity action event decode: " + action17);
              ProtocolWorldStateCodec.Opcode7 entity7 = ProtocolWorldStateCodec.decodeS2COpcode7(
                new PacketWriter().writeI16(321).writeU8(255).writeI16(1200).writeI16(340).writeI32(750)
                  .writeI8(-2).writeI8(3).writeI32(1000).writeI32(987654).toByteArray());
              if (entity7.entityId() != 321 || entity7.templateId() != 255 || entity7.x() != 1200
                  || entity7.y() != 340 || entity7.currentHp() != 750 || entity7.stateByteD() != -2
                  || entity7.stateByteI() != 3 || entity7.maxHp() != 1000 || entity7.opaqueInt() != 987654)
                throw new AssertionError("S2C opcode 7 entity state update decode: " + entity7);
              ProtocolWorldStateCodec.Opcode18 pickup18 = ProtocolWorldStateCodec.decodeS2COpcode18(
                new PacketWriter().writeI16(55).writeI8(3).writeI16(700).writeI16(701).writeI16(702)
                  .writeI8(-4).writeI8(5).writeI16(706).writeI16(707).toByteArray());
              ProtocolWorldStateCodec.Opcode19 reward19 = ProtocolWorldStateCodec.decodeS2COpcode19(
                new PacketWriter().writeI16(55).writeI16(701).writeU8(0).writeI16(250).toByteArray());
              ProtocolWorldStateCodec.Opcode20 remove20 = ProtocolWorldStateCodec.decodeS2COpcode20(
                new PacketWriter().writeI8(3).writeI16(701).toByteArray());
              ProtocolWorldStateCodec.Opcode21 inventory21 = ProtocolWorldStateCodec.decodeS2COpcode21(
                new PacketWriter().writeI16(900).writeI16(4).writeI8(-2).writeU16(60000).writeI8(1)
                  .writeU8(7).writeI16(-8).writeI8(11).writeI8(-12).toByteArray());
              if (pickup18.ownerCharacterId() != 55 || pickup18.itemId() != 701 || pickup18.fieldSByte() != -4
                  || reward19.currencyOrItemIndex() != 0 || reward19.amount() != 250
                  || remove20.entityKind() != 3 || remove20.entityId() != 701
                  || inventory21.unsignedValueW() != 60000 || inventory21.stats().get(0).value() != -8
                  || inventory21.optionalFieldC() != -12)
                throw new AssertionError("S2C opcode 18-21 inventory/entity event decode");
              ProtocolWorldStateCodec.Opcode27 chat27 = ProtocolWorldStateCodec.decodeS2COpcode27(
                new PacketWriter().writeI16(321).writeUTF("Xin chào").toByteArray());
              ProtocolWorldStateCodec.Opcode28 sold28 = ProtocolWorldStateCodec.decodeS2COpcode28(
                new PacketWriter().writeI16(900).toByteArray());
              ProtocolWorldStateCodec.Opcode30 exp30 = ProtocolWorldStateCodec.decodeS2COpcode30(
                new PacketWriter().writeI16(321).writeI16(1234).writeI32(500).toByteArray());
              ProtocolWorldStateCodec.Opcode32 resource32 = ProtocolWorldStateCodec.decodeS2COpcode32(
                new PacketWriter().writeI16(321).writeI8(1).writeUTF("hp").writeI32(1000).toByteArray(), false);
              ProtocolWorldStateCodec.Opcode32 local32 = ProtocolWorldStateCodec.decodeS2COpcode32(
                new PacketWriter().writeI16(321).writeI8(0).writeI8(4).writeI16(50).toByteArray(), true);
              ProtocolWorldStateCodec.Opcode33 level33 = ProtocolWorldStateCodec.decodeS2COpcode33(
                new PacketWriter().writeI16(321).writeI8(12).writeI32(10000).writeI32(2000).toByteArray());
              if (!chat27.message().equals("Xin chào") || sold28.itemId() != 900
                  || exp30.experienceGain() != 500 || !resource32.stats().get(0).key().equals("hp")
                  || local32.localStateByte() != 4 || local32.localShortValue() != 50
                  || level33.level() != 12 || level33.valueB() != 2000)
                throw new AssertionError("S2C opcode 27/28/30/32/33 character events");
              ProtocolWorldStateCodec.Opcode61 drop61 = ProtocolWorldStateCodec.decodeS2COpcode61(
                new PacketWriter().writeI16(321).writeI16(900).writeI8(7).writeI8(-2)
                  .writeI16(11).writeI16(12).writeI16(13).toByteArray());
              ProtocolWorldStateCodec.Opcode78 warehouse78 = ProtocolWorldStateCodec.decodeS2COpcode78(
                new PacketWriter().writeI16(901).toByteArray());
              if (drop61.characterId() != 321 || drop61.itemId() != 900 || drop61.effectType() != 7
                  || drop61.effectFieldByte() != -2 || drop61.effectShortE() != 13
                  || warehouse78.warehouseItemId() != 901)
                throw new AssertionError("S2C opcode 61/78 inventory drop/sale events");
              ProtocolWorldStateCodec.Opcode23 variant230 = ProtocolWorldStateCodec.decodeS2COpcode23(
                new PacketWriter().writeI8(0).writeI8(3).writeU8(1).writeU8(2).writeU8(255).toByteArray());
              ProtocolWorldStateCodec.Opcode23 variant231 = ProtocolWorldStateCodec.decodeS2COpcode23(
                new PacketWriter().writeI8(1).writeI8(-1).writeI16(2).writeI16(10).writeI16(11).toByteArray());
              ProtocolWorldStateCodec.Opcode23 variant232 = ProtocolWorldStateCodec.decodeS2COpcode23(
                new PacketWriter().writeI8(2).writeI8(1).writeI8(3).writeI16(50).writeI16(-2)
                  .writeI8(-4).writeI8(5).writeI16(6).writeI16(7).toByteArray());
              ProtocolWorldStateCodec.Opcode23 variant234 = ProtocolWorldStateCodec.decodeS2COpcode23(
                new PacketWriter().writeI8(4).writeI8(2).writeU8(8).writeU8(9).writeI8(-1).writeI8(3).toByteArray());
              if (variant230.subtype0Bytes().length != 3 || variant231.itemIds().get(1) != 11
                  || variant231.modeByte() != 2 || variant232.subtype2Items().get(0).normalizedValue() != 254
                  || variant234.subtype4Trailer()[0] != -1)
                throw new AssertionError("S2C opcode 23 inventory context variants");

              PacketWriter resource26Writer = new PacketWriter().writeU8(3).writeI16(3).writeU8(1).writeU8(2).writeU8(255)
                .writeU8(1).writeI16(2).writeU8(10).writeU8(11).writeU8(1).writeI16(42).writeI16(2).writeU8(12).writeU8(13)
                .writeI16(1).writeI16(43).writeI16(2).writeU8(14).writeU8(15)
                .writeI8(1).writeI8(1).writeI8(2).writeI8(3).writeI8(4).writeI8(-1).writeI8(-2).writeI8(-3).writeI8(-4)
                .writeI8(2).writeI8(1).writeI8(2).writeI8(1).writeI8(3).writeI8(1).writeI8(4).writeI8(1).writeI8(5)
                .writeI8(2).writeI8(6).writeI8(7).writeI8(1).writeI8(8);
              ProtocolWorldStateCodec.Opcode26 resource26=ProtocolWorldStateCodec.decodeS2COpcode26(resource26Writer.toByteArray());
              ProtocolWorldStateCodec.Opcode2 message2=ProtocolWorldStateCodec.decodeS2COpcode2(
                new PacketWriter().writeUTF("2shop").writeI8(1).writeUTF("Potion").writeI16(101).writeUTF("Restore HP").toByteArray());
              ProtocolWorldStateCodec.Opcode2 provider2=ProtocolWorldStateCodec.decodeS2COpcode2(
                new PacketWriter().writeUTF("3").writeUTF("provider-x").writeUTF("agent-y").toByteArray());
              ProtocolWorldStateCodec.Opcode2 plain2=ProtocolWorldStateCodec.decodeS2COpcode2(
                new PacketWriter().writeUTF("Server maintenance").toByteArray());
              ProtocolWorldStateCodec.Opcode22 aux22=ProtocolWorldStateCodec.decodeS2COpcode22(
                new PacketWriter().writeI16(12).writeI8(-3).writeI16(34).writeI32(5678).writeI8(9).toByteArray());
              ProtocolWorldStateCodec.Opcode22 aux22Default=ProtocolWorldStateCodec.decodeS2COpcode22(
                new PacketWriter().writeI16(1).writeI8(2).writeI16(3).writeI32(4).toByteArray());
              if(resource26.templateCount()!=3||resource26.indexedImages().get(0).id()!=42||resource26.indexedGraphics().get(0).id()!=43
                ||resource26.cv().get(0)[1]!=2||resource26.cw().get(0)[0]!=4||resource26.cx().get(1)[0]!=8
                ||!resource26.sectionErrors().isEmpty()||!message2.selector().equals("shop")||message2.options().get(0).value()!=101
                ||!provider2.agent().equals("agent-y")||!plain2.message().equals("Server maintenance")
                ||aux22.optionalByte()!=9||aux22Default.optionalByte()!=0)
                throw new AssertionError("S2C opcodes 2/22/26 decoders");

              PacketWriter grid35Writer=new PacketWriter();
              for(int i=0;i<165;i++)grid35Writer.writeI16(i-82);
              for(int i=0;i<165;i++)grid35Writer.writeI16(i-80);
              for(int i=0;i<15;i++)grid35Writer.writeI16(i+1);
              for(int i=0;i<165;i++)grid35Writer.writeU8(i%256);
              for(int i=0;i<165;i++)grid35Writer.writeI16(200-i);
              for(int i=0;i<165;i++)grid35Writer.writeI8((i%127)-63);
              for(int i=0;i<5;i++){grid35Writer.writeI8(i);for(int j=0;j<i;j++)grid35Writer.writeI8(j+1);}
              ProtocolWorldStateCodec.SkillGrid35 grid35=ProtocolWorldStateCodec.decodeS2COpcode35(grid35Writer.toByteArray());
              ProtocolWorldStateCodec.Opcode64 skill64=ProtocolWorldStateCodec.decodeS2COpcode64(
