                ||grid35.scaledGrid().get(0).get(0)!=-8000||grid35.unsignedGrid().get(14).get(10)!=164
                ||grid35.extraArrays().size()!=5||grid35.extraArrays().get(4).length!=4
                ||skill64.records().get(0).shortD()!=-400||!chat5.messages().get(1).message().equals("Xin chào")
                ||!dialog37.dialogBody().equals("Body")||!notice38.noticeText().equals("World notice")
                ||!sms39.success()||!sms39.smsDestination().equals("sms://1234"))
