              PacketWriter extension3 = new PacketWriter().writeI16(123).writeI8(0).writeBool(true).writeBool(false)
                .writeI8(1).writeI8(2).writeI8(3).writeI16(4).writeI32(5).writeI16(6).writeI32(7).writeUTF("title").writeBool(true)
                .writeI16(11).writeI8(12).writeI16(21).writeI8(22).writeI16(23).writeI16(31).writeI16(32).writeI16(33)
                .writeI8(2).writeI16(41).writeI8(42).writeI16(43).writeI8(44).writeUTF("a@b")
                .writeI16(51).writeI8(61).writeI16(62).writeI8(63).writeI8(64).writeI8(71).writeI16(72).writeI8(73).writeU8(0xee);
              ProtocolOpcode3ExtensionCodec.Decoded extensionDecoded = ProtocolOpcode3ExtensionCodec.decode(extension3.toByteArray());
              if (extensionDecoded.main().i() != 123 || !extensionDecoded.main().globalAe()
                  || extensionDecoded.pairA().shortValue() != 11
                  || extensionDecoded.tripleB().shortValue2() != 23
                  || extensionDecoded.tripleC().shortValue3() != 33
                  || !extensionDecoded.mappingApplied() || !extensionDecoded.mapping().text().equals("a@b")
                  || extensionDecoded.bf() != 51 || extensionDecoded.groupD().bk() != 64
                  || extensionDecoded.groupE().bl() != 73
                  || !Arrays.equals(extensionDecoded.trailingBytes(), new byte[]{(byte)0xee}))
                throw new AssertionError("opcode 3 extension decode: " + extensionDecoded);
              ProtocolOpcode3ExtensionCodec.Decoded emptyExtension = ProtocolOpcode3ExtensionCodec.decode(new byte[0]);
              if (emptyExtension.main().error() == null || emptyExtension.pairA().shortValue() != -1
                  || emptyExtension.groupD().bi() != -1 || emptyExtension.groupE().bl() != 0)
                throw new AssertionError("opcode 3 extension fallback defaults: " + emptyExtension);
              PacketWriter world5 = new PacketWriter().writeI16(17).writeUTF("Hero").writeI16(120).writeI16(240);
              for (int n : new int[]{100,200,300,400}) world5.writeI32(n);
              world5.writeI8(1).writeI8(2);
              for(int n=0;n<7;n++) world5.writeI8(n);
              for(int n=0;n<7;n++) world5.writeI16(10+n);
              world5.writeI16(50).writeI8(6).writeI16(70).writeI16(80).writeI8(9).writeI8(10).writeI8(2)
                .writeI8(3).writeI8(4).writeI8(5).writeI16(99).writeI8(7).writeI8(8).writeI8(13);
              for(int n=0;n<5;n++) world5.writeI16(200+n);
              world5.writeBool(true).writeBool(false).writeI8(11).writeI8(12).writeBool(true)
                .writeI16(21).writeI8(22).writeI16(31).writeI8(32).writeI16(33)
                .writeI16(41).writeI16(42).writeI16(43).writeI8(2).writeI16(44).writeI8(45).writeI16(46).writeI8(47).writeI16(51).writeI8(61).writeI16(62)
                .writeI8(63).writeI8(64).writeI8(71).writeI16(72).writeI8(73).writeU8(0xaa);
              ProtocolOpcode5Codec.Decoded worldDecoded = ProtocolOpcode5Codec.decode(world5.toByteArray(), true);
              if (!worldDecoded.name().equals("Hero") || worldDecoded.combatState().length != 4
                  || worldDecoded.appearanceBytes().length != 7 || worldDecoded.appearanceValues()[6] != 16
                  || worldDecoded.co() != 1 || worldDecoded.af() != 8 || worldDecoded.aS() != 13 || worldDecoded.ca()[4] != 204
                  || !worldDecoded.bM() || worldDecoded.presenceFlag()
                  || worldDecoded.optional().pairA().shortValue() != 21
                  || worldDecoded.optional().tripleB().shortValue2() != 33
                  || worldDecoded.optional().tripleC().shortValue3() != 43
                  || !worldDecoded.optional().mappingApplied() || worldDecoded.optional().mappingPairs().size() != 2
                  || worldDecoded.optional().bf() != 51 || worldDecoded.optional().groupD().bk() != 64
                  || worldDecoded.optional().groupE().bl() != 73
                  || !Arrays.equals(worldDecoded.trailingBytes(), new byte[]{(byte)0xaa}))
                throw new AssertionError("opcode 5 world snapshot decode: " + worldDecoded);
              ProtocolOpcode5Codec.Decoded unknownWorld = ProtocolOpcode5Codec.decode(new PacketWriter().writeI16(99).writeU8(1).writeU8(2).toByteArray(), false);
              if (unknownWorld.entityExists() || !Arrays.equals(unknownWorld.trailingBytes(), new byte[]{1,2}))
                throw new AssertionError("opcode 5 unknown entity guard: " + unknownWorld);
              ProtocolInitializationCodec.Decoded init = ProtocolInitializationCodec.decodeS2COpcode16(initPacket.toByteArray());
              if (!init.decoded() || init.mode() != 0 || init.currency() != 9_007_199_254_740_993L
                  || !init.skills().equals(List.of(new ProtocolInitializationCodec.SkillValue(3, -1200),
                                                    new ProtocolInitializationCodec.SkillValue(8, 250000)))
                  || init.aY() != 123456 || init.aZ() != 654321
                  || !Arrays.equals(init.trailingBytes(), new byte[]{(byte)0xde}))
                throw new AssertionError("opcode 16 mode 0 decode: " + init);
