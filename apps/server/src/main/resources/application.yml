server:
  port: 8080
spring:
  application:
    name: game-server
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mmorpg}
    username: ${DATABASE_USERNAME:mmorpg}
    password: ${DATABASE_PASSWORD:local-dev-only}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
management:
  endpoints:
    web:
      exposure:
        include: health,info
