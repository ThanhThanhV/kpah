services:
  postgres:
    image: postgres:17-alpine
    container_name: mmorpg-postgres
    environment:
      POSTGRES_DB: mmorpg
      POSTGRES_USER: mmorpg
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "5432:5432"
    volumes:
      - mmorpg-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmorpg -d mmorpg"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mmorpg-postgres-data:
